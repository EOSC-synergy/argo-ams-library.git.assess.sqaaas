config:
  credentials: []
  project_repos:
    github.com/ARGOeu/argo-ams-library:
      branch: master
      repo: https://github.com/ARGOeu/argo-ams-library.git
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ARGOeu/argo-ams-library git:
        commands:
        - /usr/bin/env sh .sqa/script.lovely-cyan-wombat.sh
        container: qc.acc_beady-firebrick-gerbil
  QC.Doc:
    repos:
      github.com/ARGOeu/argo-ams-library find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.gimpy-periwinkle-wasp.sh
        container: qc.doc_woozy-chestnut-ragdoll
      github.com/ARGOeu/argo-ams-library git:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-crimson-squirrel.sh
        container: qc.doc_wheezy-amaranth-walrus
      github.com/ARGOeu/argo-ams-library markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.messy-alizarin-monster.sh
        container: qc.doc_wimpy-grey-goose
      github.com/ARGOeu/argo-ams-library restructuredtext-lint:
        commands:
        - /usr/bin/env sh .sqa/script.ugly-turquoise-chinook.sh
        container: qc.doc_ready-heliotrope-rottweiler
  QC.Lic:
    repos:
      github.com/ARGOeu/argo-ams-library licensee:
        commands:
        - /usr/bin/env sh .sqa/script.hasty-corn-lion.sh
        container: qc.lic_flabby-firebrick-urchin
  QC.Sec:
    repos:
      github.com/ARGOeu/argo-ams-library bandit:
        commands:
        - /usr/bin/env sh .sqa/script.geeky-bronze-mongoose.sh
        container: qc.sec_homey-ultramarine-mau
  QC.Sty:
    repos:
      github.com/ARGOeu/argo-ams-library flake8:
        commands:
        - /usr/bin/env sh .sqa/script.gimpy-seashell-booby.sh
        container: qc.sty_pokey-grey-fowl
      github.com/ARGOeu/argo-ams-library hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.woolly-crimson-deer.sh
        container: qc.sty_pokey-vermilion-raccoon
  QC.Uni:
    repos:
      github.com/ARGOeu/argo-ams-library pytest:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-smalt-tiger.sh
        container: qc.uni_cheeky-zucchini-bombay
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-ams-library get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.squirrely-indigo-squirrel.sh
        container: qc.ver_seedy-ecru-whale
timeout: 5400
